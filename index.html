<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Math Attack</title>
    <style>
        :root {
            --bg: #0a0b10;
            --card: #161b22;
            --accent: #00ffcc; /* エメラルドグリーン */
            --secondary: #bc13fe; /* ネオンパープル */
            --text: #e6edf3;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 背景の幾何学模様 */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--card) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--card) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.3;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-family: monospace;
            color: var(--secondary);
        }

        .formula-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 40px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .hint {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 15px;
        }

        input {
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 10px;
            color: white;
            font-size: 2rem;
            padding: 10px;
            width: 150px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px var(--accent);
        }

        .lap-log {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 0.9rem;
            border-top: 1px solid #30363d;
            padding-top: 10px;
        }

        .btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="grid-bg"></div>

<!-- スタート画面 -->
<div class="container" id="start-screen">
    <h1>TROPICAL ATTACK</h1>
    <p>特殊演算を最速で解け</p>
    <div style="text-align:left; margin: 20px 0; font-size: 0.9rem; line-height: 1.6;">
        <span style="color:var(--accent)">⊕ (Tropical Plus)</span> = min(a, b)<br>
        <span style="color:var(--secondary)">⊗ (Tropical Times)</span> = a + b
    </div>
    <button class="btn" onclick="startGame()">SYSTEM START</button>
</div>

<!-- ゲーム画面 -->
<div class="container hidden" id="game-screen">
    <div class="stats-bar">
        <span>STAGING: <span id="q-count">1</span>/10</span>
        <span id="timer">0.000s</span>
    </div>
    <div class="formula-box" id="formula"></div>
    <div class="hint">ヒント: ⊕は小さい方、⊗は足し算</div>
    <input type="number" id="ans-input" autofocus>
    <div class="lap-log" id="lap-log"></div>
</div>

<!-- リザルト画面 -->
<div class="container hidden" id="result-screen">
    <h1 id="final-rank">MISSION COMPLETE</h1>
    <div id="total-time" style="font-size: 2rem; margin: 20px 0;"></div>
    <div id="final-logs" class="lap-log"></div>
    <button class="btn" onclick="location.reload()" style="margin-top:20px">REBOOT</button>
</div>

<script>
    let currentQ = 0;
    let lapStartTime;
    let totalStartTime;
    let questions = [];
    const logs = [];

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        // 問題生成 (10問)
        for(let i=0; i<10; i++) {
            const type = Math.random() > 0.5 ? 'plus' : 'times';
            const a = Math.floor(Math.random() * 50);
            const b = Math.floor(Math.random() * 50);
            const ans = type === 'plus' ? Math.min(a, b) : a + b;
            questions.push({ a, b, type, ans });
        }

        totalStartTime = performance.now();
        lapStartTime = totalStartTime;
        nextQuestion();
        updateTimer();
    }

    function nextQuestion() {
        if(currentQ >= 10) return showResult();
        
        const q = questions[currentQ];
        const symbol = q.type === 'plus' ? '⊕' : '⊗';
        document.getElementById('formula').innerHTML = `${q.a} <span style="color:${q.type==='plus'?'var(--accent)':'var(--secondary)'}">${symbol}</span> ${q.b}`;
        document.getElementById('q-count').innerText = currentQ + 1;
        document.getElementById('ans-input').value = '';
        document.getElementById('ans-input').focus();
    }

    function check() {
        const val = parseInt(document.getElementById('ans-input').value);
        if(val === questions[currentQ].ans) {
            const now = performance.now();
            const lap = ((now - lapStartTime) / 1000).toFixed(3);
            logs.push(lap);
            
            const logDiv = document.getElementById('lap-log');
            logDiv.innerHTML = `<div>LAP ${currentQ+1}: ${lap}s</div>` + logDiv.innerHTML;
            
            currentQ++;
            lapStartTime = now;
            nextQuestion();
        }
    }

    function updateTimer() {
        if(currentQ < 10) {
            const elapsed = ((performance.now() - totalStartTime) / 1000).toFixed(2);
            document.getElementById('timer').innerText = elapsed + 's';
            requestAnimationFrame(updateTimer);
        }
    }

    function showResult() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const total = logs.reduce((a, b) => parseFloat(a) + parseFloat(b), 0).toFixed(3);
        document.getElementById('total-time').innerText = total + 's';
        
        const finalLogs = document.getElementById('final-logs');
        logs.forEach((l, i) => {
            finalLogs.innerHTML += `<div>Q${i+1}: ${l}s</div>`;
        });
    }

    document.getElementById('ans-input').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') check();
    });
</script>
</body>
</html>
